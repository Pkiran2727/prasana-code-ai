version: '3.8'

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: prasana_code_ai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prasana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-prasana_code_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend Service (Sandbox Runner & Razorpay API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prasana_code_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-prasana_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-prasana_code_ai}}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - database

  # 3. Nginx Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: prasana_code_ai_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
