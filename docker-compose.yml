version: '3.8'

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: prasana_code_ai_db
    restart: always
    environment:
      POSTGRES_USER: prasana_user
      POSTGRES_PASSWORD: PrasanaSecureDBPassword2026
      POSTGRES_DB: prasana_code_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend Service (Sandbox Runner & Razorpay API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prasana_code_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://prasana_user:PrasanaSecureDBPassword2026@database:5432/prasana_code_ai
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_PrasanaCodeAIKey}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-PrasanaSecret12345}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - database

  # 3. Nginx Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: prasana_code_ai_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
